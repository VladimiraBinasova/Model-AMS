<body>
<div class="app">
  <aside class="side">
    <a class="brand" href="#" data-act="ststart" title="Úvodná obrazovka"><span id="brandicon"></span><b>Model synergie adaptívnej montáže</b></a>
    <nav class="nav" id="nav" aria-label="Sekcie"></nav>
    <div class="side-foot">
      <div class="proj">
        <label for="projname">Projekt</label>
        <input class="inp" id="projname" data-in="P:project.name" data-t="s" maxlength="80" aria-describedby="filestatus">
        <div class="acts"><button class="btn" data-act="fopen" title="Ctrl + O">Otvoriť…</button><button class="btn pri" data-act="fsave" title="Ctrl + S">Uložiť</button><button class="btn ghost wide" data-act="fsaveas" title="Ctrl + Shift + S">Uložiť ako nový súbor…</button></div>

      </div>
      <label for="round2"><input type="checkbox" id="round2" data-in="G:round2"> Zaokrúhľovať indexy a kvalitu väzieb na 2 desatinné miesta (ako tabuľky v práci)</label>
      <span id="autosave">Pracovná kópia sa priebežne ukladá v tomto prehliadači.</span>
    </div>
  </aside>
  <div class="main">
    <header class="top"><div class="ttl" id="ttl"></div><div class="lines" id="lines" aria-label="Linka"></div></header>
    <main class="view" id="view"></main>
  </div>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true"><div></div></div>
